[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "morse-hand"
version = "1.0.0"
description = "A local, gesture-controlled Morse transcriber"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "mediapipe==0.10.32", "numpy>=1.26,<3", "Pillow>=10,<14"]

[project.optional-dependencies]
test = ["pytest>=8.4,<10", "httpx>=0.27,<1"]

[project.scripts]
morse-hand = "morse_hand.server:main"
morse-hand-model = "morse_hand.model:main"

[tool.setuptools.package-data]
morse_hand = ["static/*"]

[tool.setuptools.packages.find]
include = ["morse_hand*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-plugin-autoload"
